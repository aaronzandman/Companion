name: One-time cleanup (remove Portal Capture release)

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the Portal Capture release, its download, and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete capture-v0.1.0.1 --repo "${{ github.repository }}" --cleanup-tag -y || echo "already gone"
